
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Live Sports</title>
  <meta name="description" content="Watch live sports streaming and schedules. Stay updated with the latest matches!">
  <meta property="og:title" content="Watch Live Sports">
  <meta property="og:description" content="Watch live sports streaming and schedules. Stay updated with the latest matches!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTb_XyoLHteh92_ZmGGYxUm84eq4I4W8-R_XZx2X0OZCw&s=10">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
    .container { max-width: 900px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); text-align: center; }
    h1 { font-size: 28px; margin-bottom: 20px; }
    img { max-width: 100%; border-radius: 10px; margin-bottom: 20px; }
  a.button {

      padding: 15px 30px; background: #ff4747; color: #fff; text-decoration: none;

      border-radius: 50px; font-weight: bold; font-size: 1.2em;

    }

    a.button:hover { background: #ff2222; }
  </style>
</head>
<body>
  <div class="container" id="content">
    <h1>Loading...</h1>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title');
    const img = params.get('img') || "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTb_XyoLHteh92_ZmGGYxUm84eq4I4W8-R_XZx2X0OZCw&s=10";

    if (title) {
      document.title = `${title} | Watch Live`;

      const content = document.getElementById('content');
      content.innerHTML = `
        <img src="${img}" alt="${title}">
        <h1>Watch Live ${title} Now</h1>
        <p>Enjoy live streaming, match schedules, and updates for ${title}.</p>
        <a class="button" href="https://www.effectivegatecpm.com/i74tezuj?key=7cee7db49427bcf14f5395842096d305">Watch Now</a>
      `;

      // Update meta tags
      const desc = `Watch live ${title} now with full streaming and updates.`;
      document.querySelector('meta[name="description"]').setAttribute('content', desc);
      document.querySelector('meta[property="og:title"]').setAttribute('content', `${title} | Watch Live`);
      document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
      document.querySelector('meta[property="og:image"]').setAttribute('content', img);
      document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
    }
  </script>
  <button id="shareBtn" style="
  display:flex;
  align-items:center;
  gap:6px;
  background:#ffcc00;
  border:none;
  padding:8px 14px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,0.2);
">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="#000">
    <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a2.5 2.5 0 0 0 0-1.39l7.02-4.11A2.99 2.99 0 1 0 14 5a3 3 0 0 0 0 6c.76 0 1.44-.3 1.96-.77l7.02 4.11a2.5 2.5 0 0 0 0 1.39l-7.02 4.11A2.99 2.99 0 1 0 18 19a3 3 0 0 0 0-6z"/>
  </svg>
  <span>Bagikan</span>
</button>

<script>
document.getElementById("shareBtn").addEventListener("click", async () => {
  const shareData = {
    title: document.title,
    text: "Coba lihat halaman ini!",
    url: window.location.href
  };
  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      // fallback kalau browser tidak mendukung Web Share API
      prompt("Salin link ini:", window.location.href);
    }
  } catch (err) {
    console.log('Gagal berbagi:', err);
  }
});
</script>

</html>
